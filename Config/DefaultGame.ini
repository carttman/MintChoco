; 이벤트가 감쇠를 따로 지정하지 않았을 때 쓸 에셋. 비워 두면 아래 두 값으로 코드가 자연 감쇠를 만든다.
;DefaultAttenuation=/Game/Audio/ATT_Default.ATT_Default
FallbackInnerRadius=300.0
FallbackFalloffDistance=3000.0
; 볼륨 슬라이더가 얹히는 믹스. 볼륨 옵션 UI가 생기면 에셋을 만들고 여기에 넣는다. 없으면 ApplyVolumeSettings가 아무것도 하지 않는다.
;MainMix=/Game/Audio/SM_Main.SM_Main
MasterClass=/Game/Audio/Classes/SC_Master.SC_Master
MusicClass=/Game/Audio/Classes/SC_Music.SC_Music
SfxClass=/Game/Audio/Classes/SC_SFX.SC_SFX
UiClass=/Game/Audio/Classes/SC_UI.SC_UI
; 경기 단계가 없는 맵(타이틀, 룸, 로비)의 곡. UGameAudioSubsystem::HandlePostLoadMap이 튼다.
LobbyMusic=(TagName="Audio.Music.Lobby")
; 단계별 곡. 등록되지 않은 단계와 뱅크에 소리가 없는 태그는 하던 곡을 이어간다(같은 태그면 처음부터
; 다시 틀지 않는다). 대기·카운트다운·경기가 같은 곡을 쓰므로 게임 맵에 들어오면 한 곡이 끊김 없이 흐른다.
; 막판(FinalRush)은 HUD의 타이머 경고선에서 갈아탄다.
; TMap은 한 줄에 전부 적는다: 배열처럼 +줄로 나누면 LoadConfig가 마지막 줄만 맵으로 읽으려다 실패한다.
MusicByPhase=((WaitingForPlayers, (TagName="Audio.Music.Playing")),(Countdown, (TagName="Audio.Music.Playing")),(Playing, (TagName="Audio.Music.Playing")),(Ended, (TagName="Audio.Music.Ended")))
MusicCrossfade=1.5
VolumeFadeTime=0.1

